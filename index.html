<body><header class="top"><button class="brand" onclick="home()"><b class="mark" id="brandMark">N</b><span><strong id="brandName">ORG CHART</strong><small id="brandSubtitle">PEOPLE DIRECTORY</small></span></button><span><i></i>Directory live　 <b class="avatar">MC</b></span></header><main><section class="intro"><div class="eyebrow">Company map / 2026</div><h1 id="pageHeading">Org chart</h1><p>Explore Northstar by department, then follow reporting lines to find the right person quickly.</p><div class="tools"><label class="search">⌕ <input id="search" placeholder="Search by name or PID" aria-label="Search by name or PID" oninput="render()" onkeydown="handleDirectorySearchKey(event)"></label></div></section><section class="section" id="view"></section></main><footer class="editor-footer"><span>Administrator tools</span><div><button class="secondary" onclick="showAdmin()">Edit website</button><button class="secondary" onclick="showPositionAdmin()">Manage positions</button></div></footer><div id="modal"></div>

let people=[['ceo','Maya Chen','Chief Executive Officer','All departments','Executive','EX-001','(555) 010-1001','HQ 4.01','maya.chen@northstar.co',imgs[0]],['ops','Jordan Ellis','Vice President of Operations','Operations','Director','OP-101','(555) 010-1101','HQ 3.14','jordan.ellis@northstar.co',imgs[1]],['tech','Noah Williams','Vice President of Technology','Technology','Director','TE-101','(555) 010-1201','HQ 3.09','noah.williams@northstar.co',imgs[2]],['pc','Priya Raman','Chief People Officer','People & Culture','Director','PC-101','(555) 010-1301','HQ 3.02','priya.raman@northstar.co',imgs[3]],['fin','Alex Morgan','Chief Financial Officer','Finance','Director','FN-101','(555) 010-1401','HQ 3.01','alex.morgan@northstar.co',imgs[4]],['field','Sofia Martinez','Director of Field Services','Operations','Manager','OP-201','(555) 010-1120','HQ 2.18','sofia.martinez@northstar.co',imgs[5]],['platform','Ethan Brooks','Director of Platform Engineering','Technology','Manager','TE-201','(555) 010-1220','HQ 2.12','ethan.brooks@northstar.co',imgs[6]]];let dept=null, selected=null;
function home(){dept=null;selected=null;render()}function render(){let q=(document.getElementById('search')?.value||'').toLowerCase(), v=document.getElementById('view');if(!dept){v.innerHTML='<div class="heading"><div><span class="kicker">Browse the directory</span><h2>Choose a department</h2></div><span class="count">4 departments</span></div><div class="departments">'+depts.map((d,i)=>`<button class="dept" onclick="openDept('${d[0]}')"><figure><img src="${d[2]}"><b class="tag ${d[3]}">${d[0]}</b></figure><article><h3>${d[0]}</h3><p>${d[1]}</p><span class="link">View org chart ↗</span></article></button>`).join('')+'</div>';return}let list=people.filter(p=>(p[3]===dept||p[0]==='ceo')&&p.slice(1,7).join(' ').toLowerCase().includes(q));v.innerHTML=`<button class="back" onclick="home()">← All departments</button><div class="heading"><div><span class="kicker">${dept}</span><h2>Reporting structure</h2></div><span class="count">${list.length} positions</span></div><div class="chart-layout"><div class="canvas"><div class="hint">↓ Click any position to view contact details</div><div class="tree">${nodes(list,'ceo')}<div class="line"></div><div class="row">${nodes(list,'director')}</div><div class="row lower">${nodes(list,'manager')}</div></div></div>${selected?details(selected):legend()}</div>`}
function openDept(d){dept=d;selected=null;render()}function nodes(list,level){return list.filter(p=>p[4].toLowerCase()===level||p[0]==='ceo'&&level==='ceo').map(p=>`<button class="node ${p[4].toLowerCase()}" onclick="selected=people.find(x=>x[0]==='${p[0]}');render()"><img src="${p[9]}"><span><strong>${p[1]}</strong><span>${p[2]}</span><small>${p[5]}</small></span></button>`).join('')||'<div class="empty">No positions found</div>'}function details(p){return `<aside class="panel"><button class="close" onclick="selected=null;render()">×</button><img src="${p[9]}"><h3>${p[1]}</h3><p><b>${p[2]}</b><br>${p[3]}</p><div class="details"><div><span>Position ID</span><b>${p[5]}</b></div><div><span>Mobile</span><b>${p[6]}</b></div><div><span>Desk phone</span><b>${p[7]}</b></div><div><span>Email</span><b>${p[8]}</b></div></div><button class="delete" onclick="people=people.filter(x=>x[0]!=='${p[0]}');selected=null;render()">Delete position</button></aside>`}function legend(){return '<aside class="panel legend"><h3>How to read this chart</h3><p>Each color maps to a level of responsibility.</p><div class="legend-item"><i class="dot red"></i>Executive leadership</div><div class="legend-item"><i class="dot navy"></i>Department leadership</div><div class="legend-item"><i class="dot teal"></i>Functional leadership</div><div class="legend-item"><i class="dot"></i>Team member</div><p style="margin-top:20px">Lines show reporting relationships. Select a position to see contact details.</p></aside>'}function showAdd(){document.getElementById('modal').innerHTML='<div class="modal" onclick="if(event.target===this)closeAdd()"><form class="form" onsubmit="add(event)"><button type="button" class="close" onclick="closeAdd()">×</button><span class="kicker">Directory admin</span><h2>Add a position</h2><div class="fields"><label>Full name<input name="name" required></label><label>Position ID<input name="pid" required></label><label class="wide">Full position title<input name="title" required></label><label>Department<select name="dept">'+depts.map(d=>`<option>${d[0]}</option>`).join('')+'</select></label><label>Level<select name="level"><option>Manager</option><option>Director</option><option>Team</option></select></label><label>Mobile<input name="phone"></label><label>Desk phone<input name="desk"></label><label class="wide">Email<input name="email" type="email"></label></div><div class="actions"><button type="button" class="cancel" onclick="closeAdd()">Cancel</button><button class="primary">Add position</button></div></form></div>'}function closeAdd(){document.getElementById('modal').innerHTML=''}function add(e){e.preventDefault();let f=new FormData(e.target),id='new'+Date.now();people.push([id,f.get('name'),f.get('title'),f.get('dept'),f.get('level'),f.get('pid'),f.get('phone')||'Not listed',f.get('desk')||'Not listed',f.get('email')||'Not listed','https://i.pravatar.cc/160?u='+id]);closeAdd();if(!dept)dept=f.get('dept');render()}render();

function showEditByPid() {
	const pid = prompt('Enter the Position ID (PID) to edit, for example OP-101:', '0000');
	if (!pid) return;
	const person = people.find((entry) => entry[5].toLowerCase() === pid.trim().toLowerCase());
	if (!person) { alert('No position was found with that PID. Use Add position to create it first.'); return; }
	const name = prompt('Full name:', person[1]); if (name === null) return;
	const title = prompt('Full position title:', person[2]); if (title === null) return;
	const department = prompt('Department:', person[3]); if (department === null) return;

	const phone = prompt('Mobile phone:', person[6]); if (phone === null) return;
	const desk = prompt('Desk phone:', person[7]); if (desk === null) return;

</script><script>
let levelLabels = JSON.parse(localStorage.getItem('org-chart-levels') || 'null') || ['Executive leadership', 'Department leadership', 'Functional leadership', 'Team member'];

function departmentOptions(value) { return depts.map((department) => `<option value="${esc(department[0])}" ${department[0] === value ? 'selected' : ''}>${esc(department[0])}</option>`).join(''); }

function fitOrgChart() {
	const tree = document.querySelector('#view .tree');
	if (!tree) return;
	const hint = tree.querySelector('.hint');
	let viewport = tree.querySelector(':scope > .chart-fit-viewport');
	let content = viewport?.querySelector(':scope > .chart-fit-content');
	// Resize must refit the existing chart, not nest another scaled viewport.
	if (!content) {
		viewport = document.createElement('div');
		viewport.className = 'chart-fit-viewport';
		content = document.createElement('div');
		content.className = 'chart-fit-content';
		[...tree.children].forEach((child) => {
			if (child !== hint) content.appendChild(child);
		});
		tree.replaceChildren();
		if (hint) {
			hint.classList.add('chart-fit-hint');
			tree.appendChild(hint);
		}
		viewport.appendChild(content);
		tree.appendChild(viewport);
	}
	requestAnimationFrame(() => {
		if (!content.isConnected) return;
		content.style.transform = 'none';
		const naturalWidth = Math.max(content.scrollWidth, content.getBoundingClientRect().width);
		const naturalHeight = Math.max(content.scrollHeight, content.getBoundingClientRect().height);
		const availableWidth = Math.max(1, viewport.clientWidth - 24);
		const availableHeight = Math.max(1, viewport.clientHeight - 24);
		if (!naturalWidth || !naturalHeight) return;
		const scale = Math.min(2, availableWidth / naturalWidth, availableHeight / naturalHeight);
		content.style.transform = `translate(-50%, -50%) scale(${scale})`;
	});
}

function fitPrintChart(sheet) {
    const stage = sheet.querySelector('.print-chart-stage');
    const chart = sheet.querySelector('.print-chart-content');
    // Measure in the same physical sheet used for printing, with NO transform.
    // Absolute max-content sizing cannot shrink to the stage's width like flex items.
    chart.style.transform = 'none';
    const bounds = chart.getBoundingClientRect();
    // Include descendant bounds on BOTH sides: scrollWidth alone misses negative
    // overflow. Center the full visible hierarchy, not just its wrapper box.
    let left = bounds.left;
    let right = Math.max(bounds.right, bounds.left + chart.scrollWidth);
    let top = bounds.top;
    let bottom = Math.max(bounds.bottom, bounds.top + chart.scrollHeight);
    chart.querySelectorAll('*').forEach(element => {
        const rect = element.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        left = Math.min(left, rect.left);
        right = Math.max(right, rect.right);
        top = Math.min(top, rect.top);
        bottom = Math.max(bottom, rect.bottom);
    });
    const naturalWidth = right - left;
    const naturalHeight = bottom - top;
    // Eight CSS pixels per edge protect borders/lines against print rounding.
    const availableWidth = stage.clientWidth - 16;
    const availableHeight = stage.clientHeight - 16;
    sheet.style.setProperty('--print-chart-offset-x', String(bounds.left + bounds.width / 2 - (left + right) / 2) + 'px');
    sheet.style.setProperty('--print-chart-offset-y', String(bounds.top + bounds.height / 2 - (top + bottom) / 2) + 'px');
    if (!(naturalWidth > 0 && naturalHeight > 0 && availableWidth > 0 && availableHeight > 0)) {
        throw new Error('The chart or printable area has no measurable size.');
    }
    // No upper cap: small departments grow; wide or tall departments shrink.
    const widthScale = availableWidth / naturalWidth;
    const heightScale = availableHeight / naturalHeight;
    sheet.style.setProperty('--print-chart-scale', String(Math.min(widthScale, heightScale)));
    chart.style.removeProperty('transform');
}

function directorySearchMatches() {
    const query = (document.getElementById('search')?.value || '').trim().toLowerCase();
    if (!query) return [];
    return people.filter(person => [person[1], person[5]].some(value =>
        String(value || '').toLowerCase().includes(query)
    )).sort((a, b) => {
        const exact = person => [person[1], person[5]].some(value => String(value || '').toLowerCase() === query);
        return Number(exact(b)) - Number(exact(a)) || String(a[1]).localeCompare(String(b[1]));
    });
}
